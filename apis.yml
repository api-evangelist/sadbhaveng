description: 'Sadbhav Engineering Limited (SEL), operating at sadbhaveng.com, is an
  Indian infrastructure and civil-engineering contractor founded in 1988 by Vishnubhai
  M. Patel and headquartered in Ahmedabad, Gujarat. The company builds and operates
  large-scale roads and highways, mining, and irrigation projects, including Build-Operate-Transfer
  (BOT) concessions of national significance, and is publicly listed on the NSE and
  BSE. This is a traditional infrastructure/construction firm: it publishes an investor-relations
  and corporate website but exposes no developer API, SDK, documentation, or other
  machine-readable API surface. Surfaced into the API Evangelist network as a stub
  via vc-portfolio harvesting; an enrichment pass confirmed there is no API product
  to catalog.'
